name: Beta bug report
description: Report a reproducible problem in a Latitude beta.
title: "[Beta bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Latitude. Please read the [beta testing guide](../blob/HEAD/docs/testing-beta.md) before filing.

        Use a backup or disposable world. Share focused evidence only, and remove personal or private information from screenshots and log excerpts.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the part of Latitude that best matches the problem.
      options:
        - Startup or crash
        - New world or spawn
        - Biome or provider placement
        - Structure or locate command
        - Existing world or retrofit
        - HUD or visual presentation
        - Performance
        - Other
    validations:
      required: true

  - type: input
    id: latitude_version
    attributes:
      label: Latitude version
      description: Enter the exact version shown in the Mods screen or playable JAR filename.
      placeholder: Paste the exact version here
    validations:
      required: true

  - type: textarea
    id: runtime_environment
    attributes:
      label: Minecraft and Fabric environment
      description: Include Minecraft, Fabric Loader, and Fabric API versions, plus whether this is singleplayer, LAN, or a dedicated server.
      placeholder: |
        Minecraft:
        Fabric Loader:
        Fabric API:
        Singleplayer, LAN, or dedicated server:
    validations:
      required: true

  - type: textarea
    id: mod_provider_stack
    attributes:
      label: Installed mods, biome providers, and datapacks
      description: Paste names and versions. Include all worldgen, biome, structure, rendering, and performance mods; write "none" for datapacks or providers that are not installed.
      placeholder: |
        Mods and versions:
        Biome/worldgen providers and versions:
        Datapacks and versions:
    validations:
      required: true

  - type: dropdown
    id: world_chunk_class
    attributes:
      label: World and chunk class
      description: Choose the option that describes the exact place where the problem appeared.
      options:
        - Fresh world created with this Latitude version; fresh chunks
        - Existing Latitude world; already-generated chunks
        - Existing Latitude world; newly generated chunks after updating
        - Unsure
    validations:
      required: true

  - type: textarea
    id: world_setup
    attributes:
      label: World setup
      description: State whether this was created as a Latitude world and list relevant settings. Do not include a private world or server name.
      placeholder: |
        Created as a Latitude world: yes / no / unsure
        World size and climate choice:
        Selected spawn zone, if relevant:
        Generate Structures: on / off / unsure
        Did the mod, provider, or datapack stack change after creation?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: List the shortest player-visible sequence that causes the problem.
      placeholder: |
        1. Create or load...
        2. Choose or run...
        3. Travel or wait...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected result
      description: What did you expect to see or happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual result
      description: What happened instead? Include the exact on-screen message when there was one.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Sometimes
        - Once
        - Unable to retry safely
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Focused evidence, or why it is unavailable
      description: Attach a focused screenshot, exact command result, crash excerpt, or short log excerpt. If none is safely available, say why. Do not attach a whole save, profile, or archive.
    validations:
      required: true

  - type: textarea
    id: optional_seed_coordinates
    attributes:
      label: Optional seed and coordinates
      description: Share these only if you are comfortable doing so, preferably from a disposable test world. They are not required.

  - type: textarea
    id: optional_diagnostics
    attributes:
      label: Optional diagnostics
      description: Performance reports may include operating system, launcher, Java version, hardware, render/simulation distance, shaders, and a comparison against a second disposable world.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked this report and its attachments for machine usernames, personal paths, private server details, credentials, and other information I do not want public.
          required: true
