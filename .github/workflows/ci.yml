name: Latitude 1.5-1.21.11 CI

on:
  pull_request:
  push:
    branches:
      - port/1.5.0-1.21.11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latitude-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + check (11 gates + policy suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # test finalizes with verifyJUnitCount (count vs tools/expected-junit-count.txt);
      # verifyReleaseArtifact checks jar contents + exclusion-spec drift; the invariant scan is
      # armed here even though it is off-by-default locally.
      - name: Build, test, gates
        run: ./gradlew --no-daemon --stacktrace --console=plain build check

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7
