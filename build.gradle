tasks.register('generateLatitudeTestMetadata') {
    group = 'latitude test artifact'
    description = 'Generate isolated TEST-only Fabric metadata; requires -PlatitudeTestSequence=N'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    inputs.property('latitudeTestSequence', latitudeTestSequenceInput)
    inputs.property('latitudeTestVersion', latitudeTestVersionInput)
    outputs.file(latitudeTestGeneratedResources.map { it.file('fabric.mod.json') })
    doLast {
        int sequence = latitudeTestSequenceValue()
        String testVersion = latitudeTestVersionValue(sequence)
        def publicJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(publicJar)
        def metadata
        try {
            def metadataEntry = zip.getEntry('fabric.mod.json')
            if (metadataEntry == null) {
                throw new GradleException("Public jar is missing fabric.mod.json: ${publicJar}")
            }
            metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
        } finally {
            zip.close()
        }
        metadata.version = testVersion
        metadata.entrypoints = new LinkedHashMap(metadata.entrypoints as Map)
        metadata.entrypoints.main = new ArrayList(metadata.entrypoints.main as List)
        metadata.entrypoints.main.add('com.example.globe.dev.LatitudeDevTestEntrypoint')
        metadata.entrypoints.client = new ArrayList(metadata.entrypoints.client as List)
        metadata.entrypoints.client.add('com.example.globe.dev.LatitudeDevTestClientEntrypoint')
        metadata.custom = ['latitude:test_artifact': true]

        def outputFile = latitudeTestGeneratedResources.get().file('fabric.mod.json').asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = groovy.json.JsonOutput.toJson(metadata)
    }
}

