plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def latitudeGitOutput = { String... args ->
    try {
        def process = new ProcessBuilder(['git'] + args.toList())
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8').trim()
        return process.waitFor() == 0 ? output : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

def latitudeBuildTimeUtc = {
    def format = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
    format.setTimeZone(TimeZone.getTimeZone('UTC'))
    return format.format(new Date())
}

def latitudeGitCommit = latitudeGitOutput('rev-parse', 'HEAD')
def latitudeGitBranch = latitudeGitOutput('branch', '--show-current')
def latitudeGitDirty = latitudeGitOutput('status', '--porcelain', '--untracked-files=no') == '' ? 'false' : 'true'
def latitudeBuildTime = latitudeBuildTimeUtc()

def latitudeTestSequenceValue = {
    def raw = findProperty('latitudeTestSequence')
    if (raw == null || raw.toString().isBlank()) {
        throw new GradleException('latitudeTestSequence is required for TEST artifact tasks')
    }
    try {
        int parsed = Integer.parseInt(raw.toString())
        if (parsed <= 0) {
            throw new GradleException('latitudeTestSequence must be a positive integer')
        }
        return parsed
    } catch (NumberFormatException ignored) {
        throw new GradleException('latitudeTestSequence must be a positive integer')
    }
}

def latitudeTestVersionValue = { int sequence ->
    "${project.version}-test.${sequence}"
}

def latitudeTestSequenceOrZero = {
    def raw = findProperty('latitudeTestSequence')
    if (raw == null || raw.toString().isBlank()) {
        return 0
    }
    try {
        return Integer.parseInt(raw.toString())
    } catch (NumberFormatException ignored) {
        return 0
    }
}

def latitudeClientXms = (findProperty('latitudeClientXms') ?: System.getProperty('latitudeClientXms') ?: '1G').toString()
def latitudeClientXmx = (findProperty('latitudeClientXmx') ?: System.getProperty('latitudeClientXmx') ?: '2G').toString()
def latitudeRunDir = (findProperty('latitude.runDir') ?: 'run').toString()
def latitudePreviewRunDir = (findProperty('latdev.preview.runDir') ?: 'run-headless').toString()

base {
    archivesName = project.archives_base_name
}

loom {

    runs {
        client {
            runDir latitudeRunDir
            vmArg "-Xms${latitudeClientXms}"
            vmArg "-Xmx${latitudeClientXmx}"
            vmArg "-Dlatitude.dev.gitCommit=${latitudeGitCommit}"
            vmArg "-Dlatitude.dev.gitBranch=${latitudeGitBranch}"
            vmArg "-Dlatitude.dev.buildDirty=${latitudeGitDirty}"
            vmArg "-Dlatitude.dev.buildTime=${latitudeBuildTime}"
            vmArg "-Dlatitude.fixSurfaceDripstone=true"
            vmArg "-Dlatitude.fogClampIndex=${System.getProperty('latitude.fogClampIndex', '-1')}"
            vmArg "-Dlatitude.fogClampValue=${System.getProperty('latitude.fogClampValue', '16.0')}"
            // AutoCreateWorldProbe defaults ON in a dev environment; forward this so a plain
            // manual-testing launch can suppress it without touching the default for anyone else.
            vmArg "-Dlatitude.debug.autoCreateWorldProbe.disable=${System.getProperty('latitude.debug.autoCreateWorldProbe.disable', 'false')}"
        }
        server {
            runDir latitudeRunDir
            vmArg "-Dlatitude.dev.gitCommit=${latitudeGitCommit}"
            vmArg "-Dlatitude.dev.gitBranch=${latitudeGitBranch}"
            vmArg "-Dlatitude.dev.buildDirty=${latitudeGitDirty}"
            vmArg "-Dlatitude.dev.buildTime=${latitudeBuildTime}"
        }
        clientNoSurfaceDripstoneFix {
            inherit client
            vmArg "-Dlatitude.fixSurfaceDripstone=false"
        }
        clientSeamAudit {
            inherit client
            name "Seam Audit (Autonomous Client)"
            programArg "--quickPlaySingleplayer"
            programArg System.getProperty('latitude.audit.world', 'Latitude')
            vmArg "-Dlatitude.audit.seam=true"
            vmArg "-Dlatitude.audit.bandPair=${System.getProperty('latitude.audit.bandPair', 'temperate-subpolar')}"
            vmArg "-Dlatitude.audit.edge=${System.getProperty('latitude.audit.edge', 'center')}"
            vmArg "-Dlatitude.audit.exitWhenDone=${System.getProperty('latitude.audit.exitWhenDone', 'true')}"
            vmArg "-Dlatitude.audit.alongSeamSpan=${System.getProperty('latitude.audit.alongSeamSpan', '256')}"
            vmArg "-Dlatitude.audit.crossSeamHalfWidth=${System.getProperty('latitude.audit.crossSeamHalfWidth', '96')}"
            vmArg "-Dlatitude.audit.chunksPerTick=${System.getProperty('latitude.audit.chunksPerTick', '6')}"
            vmArg "-Dlatitude.audit.readinessTimeoutTicks=${System.getProperty('latitude.audit.readinessTimeoutTicks', '3600')}"
            vmArg "-Dlatitude.audit.samples=${System.getProperty('latitude.audit.samples', '300')}"
        }
        biomePreview {
            server()
            name "Biome Preview (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.biomePng=${System.getProperty('latdev.biomePng', 'enabled')}"
            vmArg "-Dlatdev.locateBoundary=${System.getProperty('latdev.locateBoundary', '')}"
            vmArg "-Dlatitude.debugWorldgenPath=${System.getProperty('latitude.debugWorldgenPath', 'false')}"
            // Terrain-aware atlas was reachable in code but not from the command line: BiomePreviewExporter
            // reads this system property, and without forwarding it the preview JVM never saw it. A
            // non-terrain-aware run nulls noiseConfig/heightView, so every column classifies flat and any
            // terrain-gated rule is invisible to the map -- a census that silently cannot see what it claims
            // to measure. Defaults false, so ordinary runs stay byte-identical.
            vmArg "-Dlatitude.atlasTerrainAware=${System.getProperty('latitude.atlasTerrainAware', 'false')}"
        }
        biomeSeedSearch {
            server()
            name "Biome Seed Search (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.biomeSearch=${System.getProperty('latdev.biomeSearch', 'enabled')}"
        }
        bandAudit {
            server()
            name "Band Audit (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.bandAudit=${System.getProperty('latdev.bandAudit', 'enabled')}"
        }
    }
}

