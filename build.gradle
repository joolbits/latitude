tasks.register('latitudeSodiumFogReachabilityTest', Exec) {
    group = 'verification'
    description = 'Verify the exact Sodium 0.9.1 FogData-to-culling bytecode chain and Latitude mixin order'
    inputs.file('tools/verify_sodium_fog_reachability.py')
    inputs.file('src/main/java/com/example/globe/mixin/client/FogRendererEwMixin.java')
    inputs.file('src/main/resources/globe.mixins.json')
    inputs.files(configurations.latitudeSodiumFogVerifier)

    doFirst {
        File sodiumJar = configurations.latitudeSodiumFogVerifier.singleFile
        commandLine(
                'python3',
                file('tools/verify_sodium_fog_reachability.py'),
                '--sodium-jar', sodiumJar,
                '--source-root', rootDir)
    }
}

