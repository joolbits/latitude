def latitudeSpawnSafetyPolicyTestClasses = layout.buildDirectory.dir('classes/java/latitudeSpawnSafetyPolicyTest')

tasks.register('compileLatitudeSpawnSafetyPolicyTest', JavaCompile) {
    group = 'verification'
    description = 'Compile the dependency-free initial-spawn safety regression'
    source = fileTree('src/spawnSafetyPolicyTest/java') {
        include '**/*.java'
    }
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory.set(latitudeSpawnSafetyPolicyTestClasses)
    options.release = 25
    dependsOn classes
}

tasks.register('latitudeSpawnSafetyPolicyTest', JavaExec) {
    group = 'verification'
    description = 'Exercise warning-zone bounds and hazardous spawn-surface policy without launching Minecraft'
    classpath = files(latitudeSpawnSafetyPolicyTestClasses) + sourceSets.main.runtimeClasspath
    mainClass = 'com.example.globe.world.SpawnSafetyPolicyTest'
    dependsOn tasks.named('compileLatitudeSpawnSafetyPolicyTest')
}

tasks.named('check').configure {
    dependsOn tasks.named('latitudeSpawnSafetyPolicyTest')
}

