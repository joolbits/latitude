// The dev packaging boundary is enforced by build.gradle itself. The shipping tools boundary must
// be enforced just as mechanically, or the artifact content policy degrades into an intention that
// nothing checks. There is no CI in this repository, so `check` is the only place this can live.
tasks.register('latitudeArtifactPolicySourceScan', Exec) {
    group = 'verification'
    description = 'Assert the shipping tools surface and dev packaging law at source level'
    inputs.file('tools/verify_phase6_dev_tooling.py')
    inputs.dir('src/main/java/com/example/globe/tools')
    inputs.file('src/main/java/com/example/globe/GlobeMod.java')
    inputs.file('src/main/java/com/example/globe/dev/LatitudeDevCommand.java')
    commandLine('python3', file('tools/verify_phase6_dev_tooling.py'))
}

tasks.named('check').configure {
    dependsOn tasks.named('latitudeShippingToolsPolicyTest')
    dependsOn tasks.named('latitudeArtifactPolicySourceScan')
}

tasks.register('prepareBiomePreviewRunDir') {
    doLast {
        def dir = file(latitudePreviewRunDir)
        if (!dir.exists()) {
            dir.mkdirs()
        }

        def eulaFile = file("${dir}/eula.txt")
        eulaFile.text = "eula=true\n"

        def propsFile = file("${dir}/server.properties")
        if (!propsFile.exists()) {
            propsFile.text = """motd=Latitude Headless Preview
online-mode=false
max-players=1
enable-command-block=false
"""
        }

        def previewLevelName = (findProperty('latdev.preview.levelName') ?: System.getProperty('latdev.preview.levelName') ?: '').toString()
        def previewLevelSeed = (findProperty('latdev.preview.levelSeed') ?: System.getProperty('latdev.preview.levelSeed') ?: '').toString()
        def previewLevelType = (findProperty('latdev.preview.levelType') ?: System.getProperty('latdev.preview.levelType') ?: '').toString()
        if (previewLevelName || previewLevelSeed || previewLevelType) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            if (previewLevelName) {
                props.setProperty('level-name', previewLevelName)
            }
            if (previewLevelSeed) {
                props.setProperty('level-seed', previewLevelSeed)
            }
            if (previewLevelType) {
                props.setProperty('level-type', previewLevelType)
            }
            propsFile.withOutputStream { props.store(it, 'Minecraft server properties') }
        }
    }
}

tasks.register('syncBiomePreviewMods', Copy) {
    outputs.upToDateWhen { false }
    doFirst {
        delete file("${latitudePreviewRunDir}/mods")
    }
    from(file("${latitudeRunDir}/mods")) {
        include '*.jar'
    }
    into file("${latitudePreviewRunDir}/mods")
}

tasks.named('runBiomePreview').configure {
    workingDir file(latitudePreviewRunDir)
    dependsOn tasks.named('prepareBiomePreviewRunDir')
    if (project.hasProperty('latdev.syncPreviewMods') && project.property('latdev.syncPreviewMods').toString().toBoolean()) {
        dependsOn tasks.named('syncBiomePreviewMods')
    }
    doFirst {
        def sulfurScan = (findProperty('latdev.sulfurScan') ?: System.getProperty('latdev.sulfurScan') ?: '').toString()
        if (sulfurScan) {
            jvmArgs "-Dlatdev.sulfurScan=${sulfurScan}"
            logger.lifecycle("[runBiomePreview] forwarding latdev.sulfurScan to the preview JVM: {}", sulfurScan)
        }

        def badlandsScan = (findProperty('latdev.badlandsScan') ?: System.getProperty('latdev.badlandsScan') ?: '').toString()
        if (badlandsScan) {
            jvmArgs "-Dlatdev.badlandsScan=${badlandsScan}"
            logger.lifecycle("[runBiomePreview] forwarding latdev.badlandsScan to the preview JVM: {}", badlandsScan)
        }

        def rawArgs = new ArrayList(args ?: [])
        def latdevOptions = [:]
        def passthrough = []
        def latdevKeys = ['seed', 'radius', 'size', 'step', 'steps', 'y', 'out', 'bundle', 'layers', 'mask', 'overlay', 'overlays', 'emitbiomeindex', 'emitheight'] as Set
        def mergeKeys = ['steps', 'layers', 'mask', 'overlay', 'overlays'] as Set
        def putLatdevOption = { key, value ->
            if (mergeKeys.contains(key) && latdevOptions.containsKey(key) && latdevOptions[key] != null && latdevOptions[key].toString().trim().length() > 0) {
                latdevOptions[key] = "${latdevOptions[key]},${value}"
            } else {
                latdevOptions[key] = value
            }
        }
        boolean enabled = false

        boolean emitHeightFlag = false

        for (int i = 0; i < rawArgs.size(); i++) {
            def token = rawArgs[i]
            if (!(token instanceof String) || !token.startsWith('--')) {
                passthrough << token
                continue
            }

            def body = token.substring(2)
            if (body.equalsIgnoreCase('emitHeight')) {
                emitHeightFlag = true
                continue
            }

            if (body.equalsIgnoreCase('latdevBiomePng')) {
                enabled = true
                continue
            }

            int eq = body.indexOf('=')
            if (eq >= 0) {
                def key = body.substring(0, eq).toLowerCase(Locale.ROOT)
                def value = body.substring(eq + 1)
                if (latdevKeys.contains(key)) {
                    putLatdevOption(key, value)
                    enabled = true
                } else {
                    passthrough << token
                }
                continue
            }

            def key = body.toLowerCase(Locale.ROOT)
            if (latdevKeys.contains(key)) {
                if (i + 1 < rawArgs.size() && rawArgs[i + 1] instanceof String && !rawArgs[i + 1].startsWith('--')) {
                    putLatdevOption(key, rawArgs[i + 1])
                    i++
                } else {
                    putLatdevOption(key, 'true')
                }
                enabled = true
            } else {
                passthrough << token
            }
        }

        if (emitHeightFlag) {
            jvmArgs "-Dlatitude.emitHeight=true"
        }

        if (enabled || !latdevOptions.isEmpty()) {
            if (!latdevOptions.containsKey('out')) {
                latdevOptions['out'] = file('run/latdev/atlas').absolutePath.replace('\\', '/')
            }

            def propParts = ['enabled=true']
            latdevOptions.each { key, value ->
                propParts << "${key}=${value}"
            }
            def propValue = propParts.join(';')

            jvmArgs "-Dlatdev.biomePng=${propValue}"
            setArgs(passthrough)
            logger.lifecycle("[runBiomePreview] translated latdev --args to JVM property: {}", propValue)
        } else {
            setArgs(rawArgs)
        }
    }
}

