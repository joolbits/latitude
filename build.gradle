}

tasks.register('latitudeTestJar', Jar) {
    group = 'latitude test artifact'
    description = 'Build the isolated official-namespace dev-enabled TEST jar; requires -PlatitudeTestSequence=N'

    int sequence = latitudeTestSequenceOrZero()
    String testVersion = latitudeTestVersionValue(sequence)
    archiveFileName.set("latitude-${testVersion}.jar")
    destinationDirectory.set(layout.buildDirectory.dir('latitude-test-libs'))
    inputs.property('latitudeTestSequence', latitudeTestSequenceInput)
    inputs.property('latitudeTestVersion', latitudeTestVersionInput)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    dependsOn tasks.named('jar')
    dependsOn tasks.named(sourceSets.latitudeTest.classesTaskName)
    dependsOn tasks.named('generateLatitudeTestMetadata')
    doFirst {
        int validatedSequence = latitudeTestSequenceValue()
        String validatedVersion = latitudeTestVersionValue(validatedSequence)
        def publicJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(publicJar)
        def publicManifest
        try {
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) {
                throw new GradleException("Public jar is missing META-INF/MANIFEST.MF: ${publicJar}")
            }
            publicManifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
        } finally {
            zip.close()
        }
        def publicAttributes = publicManifest.mainAttributes
        manifest.attributes(
                'Implementation-Title': publicAttributes.getValue('Implementation-Title'),
                'Implementation-Version': validatedVersion,
                'Minecraft-Version': publicAttributes.getValue('Minecraft-Version'),
                'Git-Commit': publicAttributes.getValue('Git-Commit'),
                'Git-Branch': publicAttributes.getValue('Git-Branch'),
                'Build-Time': publicAttributes.getValue('Build-Time'),
                'Build-Dirty': publicAttributes.getValue('Build-Dirty'),
                'Latitude-Artifact-Role': 'TEST',
                'Latitude-Test-Sequence': Integer.toString(validatedSequence),
                'Latitude-Artifact-Version': validatedVersion,
                'Fabric-Mapping-Namespace': 'official'
        )
    }

    from({
        zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'fabric.mod.json'
    }

    from(sourceSets.main.output) {
        include 'com/example/globe/dev/**'
        include 'com/example/globe/debug/**'
        include 'com/example/globe/client/ClipboardImageWriter.class'
        include 'com/example/globe/client/ClipboardImageWriter$*.class'
    }
    from(sourceSets.latitudeTest.output)
    from(latitudeTestGeneratedResources) {
        include 'fabric.mod.json'
    }

    manifest {
        attributes(
                'Implementation-Title': project.base.archivesName.get(),
                'Implementation-Version': testVersion,
                'Minecraft-Version': project.minecraft_version,
                'Git-Commit': latitudeGitCommit,
                'Git-Branch': latitudeGitBranch,
                'Build-Time': latitudeBuildTime,
                'Build-Dirty': latitudeGitDirty,
                'Latitude-Artifact-Role': 'TEST',
                'Latitude-Test-Sequence': Integer.toString(sequence),
                'Latitude-Artifact-Version': testVersion,
                'Fabric-Mapping-Namespace': 'official'
        )
    }
}

